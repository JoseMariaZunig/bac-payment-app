services:
  api:
    build:
      context: ./api
    container_name: bac-payment-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}

      Bac__ClientId: ${BAC_CLIENT_ID}
      Bac__ClientSecret: ${BAC_CLIENT_SECRET}
      Bac__TokenUrl: ${BAC_TOKEN_URL}
      Bac__Scope: ${BAC_SCOPE:-tcd}
      Bac__PaymentUrl: ${BAC_PAYMENT_URL}
      Bac__TrackingUrl: ${BAC_TRACKING_URL}
      Bac__Camt060Url: ${BAC_CAMT060_URL}
      Bac__Camt942Url: ${BAC_CAMT942_URL}
      Bac__CamtSaldoUrl: ${BAC_CAMT_SALDO_URL}
      Bac__Camt053Url: ${BAC_CAMT053_URL}
      Bac__IbmClientId: ${BAC_IBM_CLIENT_ID}
      Bac__CuentaPagadora: ${BAC_CUENTA_PAGADORA}
      Bac__Id1: ${BAC_ID1}
      Bac__Id2: ${BAC_ID2}
      Bac__Id3: ${BAC_ID3}
      Bac__FrBicfi: ${BAC_FR_BICFI:-CORPFONTXXX}
      Bac__ToBicfi: ${BAC_TO_BICFI:-BSNJCRSJ}

      Softland__ConnectionString: ${SOFTLAND_CONNECTION_STRING}
    networks:
      - bac-net

  web:
    build:
      context: ./web
    container_name: bac-payment-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
    depends_on:
      - api
    networks:
      - bac-net

networks:
  bac-net:
    driver: bridge
